<text x="28.00" y="245.00" font-size="3" text-anchor="start" font-weight="400" fill="#111">1. Unidades: milímetros. Escala 1:1. Proyección ISO (1er diedro).</text>
<text x="28.00" y="250.20" font-size="3" text-anchor="start" font-weight="400" fill="#111">2. Tolerancia general ±0.2 mm; holguras de impresión 0.2–0.3 mm.</text>
<text x="28.00" y="255.40" font-size="3" text-anchor="start" font-weight="400" fill="#111">3. Material: PETG (o PLA para pruebas bajo techo). Espesor de pared 2.5 mm.</text>
<text x="28.00" y="260.60" font-size="3" text-anchor="start" font-weight="400" fill="#111">4. Tapa: 4 tornillos M3×8 en postes Ø8 con agujero guía Ø2.5; agujeros pasantes Ø3.4.</text>
<text x="28.00" y="265.80" font-size="3" text-anchor="start" font-weight="400" fill="#111">5. Perfboard 90×70×1.6 sobre 4 separadores M3 de 6 mm (retirable).</text>
<text x="28.00" y="271.00" font-size="3" text-anchor="start" font-weight="400" fill="#111">6. Plano de REFERENCIA generado de generar_modelo.py con medidas nominales:</text>
