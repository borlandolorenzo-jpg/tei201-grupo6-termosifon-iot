<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 860" font-family="Helvetica, Arial, sans-serif">
<rect width="1460" height="860" fill="#fff"/>
<text x="30" y="36" font-size="21" text-anchor="start" font-weight="700" fill="#12262a">Esquemático eléctrico — Controlador termosifón IoT (TEI201 · Grupo 6) · Rev. A</text>
<text x="30" y="58" font-size="12.5" text-anchor="start" font-weight="400" fill="#5b6f73">Los cables con el mismo nombre de red (+5V, GND, +3V3, ONEWIRE, ...) están conectados entre sí. ESP32 DevKit V1 de 30 pines.</text>
