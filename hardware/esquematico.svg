<text x="30" y="850" font-size="11.5" text-anchor="start" font-weight="400" fill="#5b6f73">Consumo estimado: ESP32 con WiFi ≈ 0.25 A pico; SG90 ≈ 0.65 A en bloqueo → fuente de 5 V / 2 A con margen (se verificará con multímetro, protocolo P2).</text>
